# Tertiary model, after the stack is up:
# docker compose exec ollama ollama pull llama3.2

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sift}
      POSTGRES_DB: ${POSTGRES_DB:-sift}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:-sift}@postgres:5432/${POSTGRES_DB:-sift}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      POLICY_STORAGE_DIR: /data/policies
      POSTAJOB_API_KEY: ${POSTAJOB_API_KEY:-}
      POSTAJOB_BASE_URL: ${POSTAJOB_BASE_URL:-https://api.postajob.io/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      COMPANY_NAME: ${COMPANY_NAME:-Sift}
      COMPANY_COUNTRY: ${COMPANY_COUNTRY:-Bangladesh}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAILPIT_BASE_URL: http://mailpit:8025
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      INVITE_FROM_ADDRESS: ${INVITE_FROM_ADDRESS:-jobs@sift.local}
      APPLY_TO_ADDRESS: ${APPLY_TO_ADDRESS:-careers@sift.local}
      CV_STORAGE_DIR: /data/cvs
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-20}
    ports:
      - "8000:8000"
    volumes:
      - policy_data:/data/policies
      - cv_data:/data/cvs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:-sift}@postgres:5432/${POSTGRES_DB:-sift}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      MAILPIT_BASE_URL: http://mailpit:8025
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      INVITE_FROM_ADDRESS: ${INVITE_FROM_ADDRESS:-jobs@sift.local}
      APPLY_TO_ADDRESS: ${APPLY_TO_ADDRESS:-careers@sift.local}
      CV_STORAGE_DIR: /data/cvs
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      COMPANY_NAME: ${COMPANY_NAME:-Sift}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-20}
    volumes:
      - cv_data:/data/cvs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  policy_data:
  cv_data:
