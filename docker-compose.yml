# Tertiary model, after the stack is up:
# docker compose exec ollama ollama pull llama3.2
# The live turn label uses llama3.2:1b. The 3B model is killed inside Docker's memory cap.
# docker compose exec ollama ollama pull llama3.2:1b

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sift}
      POSTGRES_DB: ${POSTGRES_DB:-sift}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:-sift}@postgres:5432/${POSTGRES_DB:-sift}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      POLICY_STORAGE_DIR: /data/policies
      POSTAJOB_API_KEY: ${POSTAJOB_API_KEY:-}
      POSTAJOB_BASE_URL: ${POSTAJOB_BASE_URL:-https://api.postajob.io/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MCP_SERVER_URL: http://mcp:8080/mcp
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      COMPANY_NAME: ${COMPANY_NAME:-Sift}
      COMPANY_COUNTRY: ${COMPANY_COUNTRY:-Bangladesh}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-minilm}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      FACE_BACKEND: ${FACE_BACKEND:-insightface}
      FACE_MODEL: ${FACE_MODEL:-buffalo_l}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAILPIT_BASE_URL: http://mailpit:8025
      CV_STORAGE_DIR: /data/cvs
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-20}
      JWT_SECRET: ${JWT_SECRET:-sift-dev-change-me-before-any-real-interview}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-240}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-turn:localhost:3478}
      TURN_USERNAME: ${TURN_USERNAME:-sift}
      TURN_PASSWORD: ${TURN_PASSWORD:-sift-turn}
      RECRUITER_PASSWORD: ${RECRUITER_PASSWORD:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      AI_INTERVIEWER_ENABLED: ${AI_INTERVIEWER_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - policy_data:/data/policies
      - cv_data:/data/cvs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      mcp:
        condition: service_started

  mcp:
    build: ./backend
    command: python -m app.mcp_jobs
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8081:8080"

  worker:
    build: ./backend
    command: python -m app.worker
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:-sift}@postgres:5432/${POSTGRES_DB:-sift}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-minilm}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      FACE_BACKEND: ${FACE_BACKEND:-insightface}
      FACE_MODEL: ${FACE_MODEL:-buffalo_l}
      MAILPIT_BASE_URL: http://mailpit:8025
      CV_STORAGE_DIR: /data/cvs
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      COMPANY_NAME: ${COMPANY_NAME:-Sift}
      MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-20}
    volumes:
      - cv_data:/data/cvs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  transcriber:
    build: ./backend
    command: python -m app.transcribe_worker start
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:-sift}@postgres:5432/${POSTGRES_DB:-sift}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  interviewer:
    build: ./backend
    command: python -m app.interviewer_worker start
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:-sift}@postgres:5432/${POSTGRES_DB:-sift}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      AI_INTERVIEWER_ENABLED: ${AI_INTERVIEWER_ENABLED:-true}
      SPEECH_MODEL_DIR: /data/speech
      PIPER_VOICE: ${PIPER_VOICE:-en_GB-cori-medium}
      SPEECH_VOICE_ENGINE: ${SPEECH_VOICE_ENGINE:-kokoro}
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
      KOKORO_SPEED: ${KOKORO_SPEED:-1.08}
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      GROQ_TTS_MODEL: ${GROQ_TTS_MODEL:-canopylabs/orpheus-v1-english}
      GROQ_TTS_VOICE: ${GROQ_TTS_VOICE:-autumn}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      COMPANY_NAME: ${COMPANY_NAME:-Sift}
    volumes:
      - speech_data:/data/speech
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  coturn:
    image: coturn/coturn:4.6.2
    ports:
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:49152-49172:49152-49172/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=sift
      - --user=${TURN_USERNAME:-sift}:${TURN_PASSWORD:-sift-turn}
      - --min-port=49152
      - --max-port=49172
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  policy_data:
  cv_data:
  speech_data:
